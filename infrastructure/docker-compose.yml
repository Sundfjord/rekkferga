# Runs the API in Docker the same way Railway does (gunicorn), for local testing.
# The web app runs with `npm run dev:web` — it is a static site, not a container.
#
#   HERE_API_KEY=... docker compose -f infrastructure/docker-compose.yml up --build
services:
  api:
    build: ../packages/api
    ports:
      - "5000:5000"
    environment:
      - HERE_API_KEY=${HERE_API_KEY}
      - FLASK_ENV=development
      - PORT=5000
    restart: unless-stopped

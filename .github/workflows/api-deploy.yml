name: Deploy API to Railway

on:
  push:
    branches: [master]
    paths:
      - "packages/api/**"
      - ".github/workflows/api-deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -f "test_app.py" ]; then
            python -m pytest test_app.py -v
          else
            echo "No tests found, skipping test execution"
          fi

      - name: Run linting
        run: |
          if command -v flake8 &> /dev/null; then
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          else
            echo "flake8 not available, skipping linting"
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: packages/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # The project has more than one service, so the CLI needs to be told which one to
      # deploy. RAILWAY_SERVICE is a repository *variable* (not a secret): the API service's
      # name or ID, from Railway → service → Settings.
      - name: Deploy to Railway
        run: |
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Repository variable RAILWAY_SERVICE is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          railway up --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}

      - name: Notify deployment
        run: |
          echo "✅ API deployed successfully to Railway"
          echo "🌐 Environment: ${{ github.ref_name }}"
          echo "📦 Package: rekkferga-api"
